services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo_local_only}
      POSTGRES_DB: seo_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo_agent"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://seo:${POSTGRES_PASSWORD:-seo_local_only}@db:5432/seo_agent
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"   # dashboard + API at http://localhost:8000

volumes:
  pgdata:
