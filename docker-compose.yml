services:
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["audit-data:/app/data"]
    restart: unless-stopped
  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      BACKEND_API_KEY: ${SEO_API_KEY:-}
      APP_ACCESS_CODE: ${APP_ACCESS_CODE:-}
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  audit-data:
