services:
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["audit-data:/app/data"]
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  audit-data:
